# Visit https://soloterm.com to learn more
name: laravel-cloud-python-logging
icon: null
processes:
  1 - update uv:
    command: if brew list uv >/dev/null 2>&1; then brew update && brew upgrade uv; else uv self update; fi
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  2 - update pythons:
    command: uv run --no-project scripts/update_pythons.py
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  3 - update deps:
    command: uv lock --upgrade
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  4 - uv sync:
    command: uv sync
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  5 - fix:
    command: uv run ruff check --fix . && uv run ruff format .
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  6 - check:
    command: uv run --locked scripts/check.py
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
