[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laravel-cloud-logging"
version = "0.1.0"
description = "Laravel-style (Monolog JSON) logging for Python apps on Laravel Cloud"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Logging",
]

[project.urls]
Source = "https://github.com/DGarbs51/laravel-cloud-python-logging"

[dependency-groups]
test = ["pytest", "flask", "starlette", "httpx", "django", "celery", "gunicorn", "rq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
