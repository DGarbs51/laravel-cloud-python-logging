[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laravel-cloud-logging"
version = "0.1.1"
description = "Laravel-style (Monolog JSON) logging for Python apps on Laravel Cloud"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devon Garbalosa" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["laravel", "laravel-cloud", "logging", "monolog", "json", "django", "flask", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Celery",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/DGarbs51/laravel-cloud-python-logging"
Source = "https://github.com/DGarbs51/laravel-cloud-python-logging"
Issues = "https://github.com/DGarbs51/laravel-cloud-python-logging/issues"
Releases = "https://github.com/DGarbs51/laravel-cloud-python-logging/releases"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[dependency-groups]
test = [
    "pytest", "pytest-timeout", "coverage", "flask", "starlette", "httpx2", "django", "celery", "gunicorn", "rq",
    "uvicorn", "hypercorn", "granian", "waitress",
]
release = ["twine"]
dev = [
    { include-group = "test" },
    { include-group = "release" },
    "celery-types>=0.26.0",
    "django-stubs>=6.0.9",
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]
timeout = 120

[tool.coverage.run]
branch = true
parallel = true
source = ["laravel_cloud_logging"]

[tool.coverage.paths]
source = ["src/laravel_cloud_logging", "*/site-packages/laravel_cloud_logging"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.10"
files = ["src/laravel_cloud_logging"]
strict = true
disallow_any_explicit = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[tool.pyright]
include = ["src/laravel_cloud_logging"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ty.src]
include = ["src/laravel_cloud_logging"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
unsound-return-statement = "error"
unused-ignore-comment = "error"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "PGH", "ANN", "PYI"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
